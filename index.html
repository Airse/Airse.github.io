  <style>
    :root { color-scheme:light dark; --bg:#EFF3F8; --surface:#D6E0ED; --ink:#151D2B; --text:#344258; --shadow:#151D2B; font-family:Roboto,Arial,sans-serif; color:var(--ink); background:var(--bg); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:var(--bg); }
    a { color:inherit; text-underline-offset:4px; }
    a:focus-visible { outline:3px solid var(--ink); outline-offset:6px; }
    .skip { position:absolute; top:-100px; left:16px; background:var(--bg); padding:16px; z-index:2; }
    .skip:focus { top:8px; }
    .wrap { width:min(100% - 48px,1080px); margin-inline:auto; }
    header { display:flex; align-items:center; justify-content:space-between; gap:24px; min-height:100px; border-bottom:1px solid var(--surface); }
    .brand { font-size:24px; font-weight:700; text-decoration:none; letter-spacing:-1px; }
    .app { margin-top:40px; background:var(--surface); border-radius:24px; padding:clamp(24px,5vw,56px); margin-bottom:48px; }
    h2 { font-size:clamp(28px,4vw,40px); letter-spacing:-1px; line-height:1.15; margin:0 0 20px; }
    p { line-height:1.7; color:var(--text); }
    .app p { max-width:540px; }
    .button { display:inline-flex; gap:12px; align-items:center; justify-content:center; min-height:48px; padding:12px 22px; border:2px solid var(--ink); border-radius:999px; background:var(--bg); box-shadow:4px 4px 0 var(--shadow); text-decoration:none; font-size:14px; font-weight:600; margin:16px 0 8px; }
    .button:hover { transform:translateY(-2px); }
    .app-icon { display:block; width:96px; height:96px; border-radius:24px; margin-bottom:24px; }
    .links { display:flex; flex-wrap:wrap; gap:4px 20px; margin-top:12px; font-size:12px; }
    .links a { display:inline-flex; align-items:center; min-height:48px; }
    @media(prefers-color-scheme:dark) { :root { --bg:#181C24; --surface:#293342; --ink:#EFF3F8; --text:#D6E0ED; --shadow:#090D14; } }
    @media(max-width:640px) { .wrap { width:calc(100% - 32px); } header { min-height:80px; } }
    @media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } .button:hover { transform:none; } }
  </style>
</head>
